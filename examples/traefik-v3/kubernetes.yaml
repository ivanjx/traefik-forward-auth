apiVersion: v1
kind: Namespace
metadata:
  name: tfa
---
apiVersion: v1
kind: Secret
metadata:
  name: tfa-admin
  namespace: tfa
type: Opaque
stringData:
  ADMIN_GOOGLE_CLIENT_ID: replace-me
  ADMIN_GOOGLE_CLIENT_SECRET: replace-me
  ADMIN_EMAILS: admin@example.com
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tfa-data
  namespace: tfa
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-forward-auth
  namespace: tfa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik-forward-auth
  template:
    metadata:
      labels:
        app: traefik-forward-auth
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1654
      containers:
        - name: traefik-forward-auth
          image: ghcr.io/ivanjx/traefik-forward-auth:latest
          ports:
            - name: forward-auth
              containerPort: 4181
            - name: admin
              containerPort: 4182
          envFrom:
            - secretRef:
                name: tfa-admin
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /settings
              port: admin
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tfa-data
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-forward-auth
  namespace: tfa
spec:
  selector:
    app: traefik-forward-auth
  ports:
    - name: forward-auth
      port: 4181
      targetPort: forward-auth
    - name: admin
      port: 4182
      targetPort: admin
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tfa
  namespace: tfa
spec:
  forwardAuth:
    address: http://traefik-forward-auth.tfa.svc.cluster.local:4181
    authResponseHeaders:
      - X-Forwarded-User
      - X-Forwarded-Role
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tfa-admin
  namespace: tfa
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`tfa-admin.example.com`)
      kind: Rule
      services:
        - name: traefik-forward-auth
          port: admin
  tls: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: tfa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: tfa
spec:
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: tfa
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`whoami.example.com`)
      kind: Rule
      middlewares:
        - name: tfa
      services:
        - name: whoami
          port: http
  tls: {}
